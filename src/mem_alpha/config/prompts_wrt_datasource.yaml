    query_prompt: "Your memory stores a chronological sequence of git commits for a single repository. Each commit is a JSON object with keys: commit_sha, parent_sha, timestamp, user, user_id, comment, combined_patch. Use ONLY the information in your memory to answer. Answer with the exact value only — output a single short token, phrase, integer, or comma-separated list as appropriate, with NO explanation, NO full sentence, NO surrounding words, NO units or labels unless they appear in the gold value, and NO trailing punctuation. If your memory contains no relevant information, answer \"NA\". Put the final answer inside \\boxed{answer}."
    including_core: true

horizonbench:
    query_prompt: "Your memory stores a chronological sequence of dialogue sessions between a user and an assistant. Each session is anchored by a timestamp and event id, and may include user/assistant turns plus preference-change events. Use ONLY the information in your memory to answer. Question types you may receive:\n  - simple/current state: answer with the user's current value for the requested attribute\n  - n-back (N preference-change events ago): answer with the value at that historical state; if N exceeds total events, answer \"NA\"\n  - counting: number of distinct value changes for an attribute (single integer)\n  - ordering: comma-separated list of distinct values from earliest to most recent\n  - multihop: bridge / comparison between two attributes\nAnswer with the exact enum value, integer, or comma-separated list as appropriate. If your memory has no relevant information, answer \"NA\". Put the final answer inside \\boxed{answer}."
    including_core: true

