conflict_resolution:
    query_prompt: "Your core memory stores factual information provided throughout the conversation. Some of these facts may become outdated or contradicted by new information. When new evidence conflicts with previously stored memory, you must identify the contradiction and update your memory by selectively forgetting or overwriting the outdated information. Do not retain both conflicting facts.Your semantic memory may contain prior facts and examples. However, you must ensure that only the most recent and correct information is used when answering. When answering questions, rely on the updated memory after resolving conflicts. Ignore any outdated or contradictory information. Provide your final answer in the format \\boxed{answer}."
    including_core: true

